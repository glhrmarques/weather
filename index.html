<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Figtree', sans-serif;
        }
    </style>
</head>
<body class="bg-[#FBFBFB] overflow-hidden">
    <div class="flex flex-col gap-10 px-4 pt-14 pb-4 h-screen">
        <!-- Top Section -->
        <div class="flex flex-col gap-8">
            <!-- Logo/Icon -->
            <img src="images/chile-flag.svg" alt="Chile Flag" class="w-[30px] h-[20px]">
            
            <!-- Weather Info -->
            <div class="flex flex-col gap-1 items-start w-full">
                <!-- Temperature -->
                <p id="temp-c-info" class="text-[144px] leading-none font-normal text-black w-full">
                    
                </p>
                
                <!-- Location and Condition -->
                <div class="flex gap-2.5 items-center justify-start w-full">
                    <p id="location-info" class="text-[18px] font-semibold text-black">
                        
                    </p>
                    <div class="w-1 h-1 bg-black rounded-full"></div>
                    <p id="condition-info" class="text-[18px] font-normal text-black">
                        
                    </p>
                </div>
            </div>
        </div>
        
        <!-- Image Gallery -->
        <div class="flex-1 flex gap-4 overflow-x-auto">
            <div class="h-full w-[330px] rounded-[56px] bg-gray-300 flex-shrink-0">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=330&h=600&fit=crop" 
                     alt="Landscape" 
                     class="w-full h-full object-cover rounded-[56px]">
            </div>
            <div class="h-full w-[330px] rounded-[56px] bg-gray-300 flex-shrink-0">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=330&h=600&fit=crop" 
                     alt="Landscape" 
                     class="w-full h-full object-cover rounded-[56px]">
            </div>
            <div class="h-full w-[330px] rounded-[56px] bg-gray-300 flex-shrink-0">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=330&h=600&fit=crop" 
                     alt="Landscape" 
                     class="w-full h-full object-cover rounded-[56px]">
            </div>
        </div>
    </div>

    <script>
        async function fetchWeather() {
            try {
                const response = await fetch('http://localhost:3003/api/weather');
                const data = await response.json();

                const tempElement = document.querySelector("#temp-c-info");
                const locationElement = document.querySelector("#location-info");
                const conditionElement = document.querySelector("#condition-info");
                
                // Update with actual data
                tempElement.textContent = `${data.current.temp_c}°`;
                locationElement.textContent = data.location.name;
                conditionElement.textContent = data.current.condition.text;

            } catch (error) {
                console.error('Error', error);
                document.getElementById('temp-c-info').textContent = '--°';
                document.getElementById('weather-info').textContent = 'Location unavailable';
                document.getElementById('condition-info').textContent = 'Condition unavailable';
            }
        }

        fetchWeather();
    </script>
</body>
</html>
