<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Figtree', sans-serif;
        }
        /* Hide scrollbar for carousel */
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;  /* Chrome, Safari, Opera */
        }
        
        /* Entrance animations */
        @keyframes slideInFromLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-slide-left {
            animation: slideInFromLeft 0.6s ease-out forwards;
        }
        
        .animate-fade-up {
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.45s; }
    </style>
</head>
<body class="bg-[#FBFBFB] overflow-hidden">
    <div class="flex flex-col gap-10 px-4 pt-14 pb-10 h-screen">
        <!-- Top Section -->
        <div class="flex flex-col gap-8">
            <!-- Logo/Icon -->
            <img src="images/chile-flag.svg" alt="Chile Flag" class="w-[44] h-[29px] self-start animate-slide-left">
            
            <!-- Weather Info -->
            <div class="flex flex-col gap-1 items-start w-full">
                <!-- Temperature -->
                <p id="temp-c-info" class="text-[144px] leading-none font-normal text-black w-full animate-fade-up delay-1">
                
                </p>
                
                <!-- Location and Condition -->
                <div class="flex gap-2.5 items-center justify-start w-full animate-fade-up delay-2">
                    <p id="location-info" class="text-[28px] font-semibold text-black">
                        
                    </p>
                    <div class="w-1 h-1 bg-black rounded-full"></div>
                    <p id="condition-info" class="text-[28px] font-normal text-black">
                        
                    </p>
                </div>
            </div>
        </div>
        
        <!-- Image Gallery -->
        <div class="flex-1 flex gap-4 overflow-x-auto hide-scrollbar animate-fade-up delay-3">
            <div class="h-full w-[330px] rounded-[56px] bg-gray-300 flex-shrink-0">
                <img src="images/atacama-01.avif" 
                     alt="Atacama Desert" 
                     class="w-full h-full object-cover rounded-[56px]">
            </div>
            <div class="h-full w-[330px] rounded-[56px] bg-gray-300 flex-shrink-0">
                <img src="images/atacama-02.avif" 
                     alt="Atacama Desert" 
                     class="w-full h-full object-cover rounded-[56px]">
            </div>
            <div class="h-full w-[330px] rounded-[56px] bg-gray-300 flex-shrink-0">
                <img src="images/atacama-03.avif" 
                     alt="Atacama Desert" 
                     class="w-full h-full object-cover rounded-[56px]">
            </div>
            <div class="h-full w-[330px] rounded-[56px] bg-gray-300 flex-shrink-0">
                <img src="images/atacama-04.avif" 
                     alt="Atacama Desert" 
                     class="w-full h-full object-cover rounded-[56px]">
            </div>
            <div class="h-full w-[330px] rounded-[56px] bg-gray-300 flex-shrink-0">
                <img src="images/atacama-05.avif" 
                     alt="Atacama Desert" 
                     class="w-full h-full object-cover rounded-[56px]">
            </div>
            <div class="h-full w-[330px] rounded-[56px] bg-gray-300 flex-shrink-0">
                <img src="images/atacama-06.avif" 
                     alt="Atacama Desert" 
                     class="w-full h-full object-cover rounded-[56px]">
            </div>
        </div>
    </div>

    <script>
        async function fetchWeather() {
            try {
                const response = await fetch('/api/weather');
                const data = await response.json();

                const tempElement = document.querySelector("#temp-c-info");
                const locationElement = document.querySelector("#location-info");
                const conditionElement = document.querySelector("#condition-info");
                
                // Update with actual data
                tempElement.textContent = `${data.current.temp_c}°`;
                locationElement.textContent = data.location.name;
                conditionElement.textContent = data.current.condition.text;

            } catch (error) {
                console.error('Error', error);
                document.getElementById('temp-c-info').textContent = '--°';
                document.getElementById('weather-info').textContent = 'Location unavailable';
                document.getElementById('condition-info').textContent = 'Condition unavailable';
            }
        }

        fetchWeather();
    </script>
</body>
</html>
